[package]
name = "krino-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HTTP API service for Krino evaluation engine"
license.workspace = true
repository.workspace = true

[[bin]]
name = "krino-api"
path = "src/main.rs"

[dependencies]
# The engine
krino = { path = "../krino" }
krino-api-types.workspace = true

# Workspace dependencies
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true

# HTTP framework
axum = { version = "0.8", features = ["json", "macros"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = [
    "cors", "trace", "request-id", "set-header",
    "compression-gzip", "sensitive-headers"
] }

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }

# Auth + crypto
subtle = "2.6"  # constant-time comparison for API keys

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
async-channel = "2"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.8"
http-body-util = "0.1"
