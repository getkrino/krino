name: Release

# Manual-only for v1. Trigger from the Actions tab with the target version.
# After v1 stabilizes we can wire automatic version bumping via release-please
# or git-cliff.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Must match Cargo.toml.'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version matches workspace
        run: |
          WORKSPACE_VERSION=$(grep -m1 '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "$WORKSPACE_VERSION" != "${{ inputs.version }}" ]]; then
            echo "Workspace version ($WORKSPACE_VERSION) does not match input version (${{ inputs.version }})."
            echo "Update Cargo.toml first and merge to main, then re-run with the matching version."
            exit 1
          fi

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/dfbin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-v3
          restore-keys: |
            ${{ runner.os }}-cargo-v3-

      - name: Build CLI binary
        run: |
          cargo build --release --package krino --features cli --bin krino
          mkdir -p release-artifacts
          cp target/release/krino release-artifacts/krino-linux-x64
          chmod +x release-artifacts/krino-linux-x64

      - name: Build API binary
        run: |
          cargo build --release --package krino-api --bin krino-api
          cp target/release/krino-api release-artifacts/krino-api-linux-x64
          chmod +x release-artifacts/krino-api-linux-x64

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          body: |
            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: |
            release-artifacts/krino-linux-x64
            release-artifacts/krino-api-linux-x64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
