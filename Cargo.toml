[workspace]
resolver = "2"
members = [
    "krino",
    "krino-api",
    "krino-api-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["Justin Smith"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/getkrino/krino"
homepage = "https://github.com/getkrino/krino"

[workspace.dependencies]
krino-api-types = { path = "krino-api-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["sync", "time", "rt", "macros", "signal"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
